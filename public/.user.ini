; Room for uploading portfolio videos (up to 100 MB) from the admin panel.
; Read by PHP-FPM / CGI / LiteSpeed hosts (typical cPanel). Apache-module PHP uses the same values from .htaccess instead.
; PHP re-reads this file about every 5 minutes (user_ini.cache_ttl).
upload_max_filesize = 100M
post_max_size = 110M
max_input_time = 300
